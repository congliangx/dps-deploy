# PostgreSQL authentication; DPS and PRS databases use role dps over TLS only.
local all postgres peer
local all all scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl dps dps 10.6.131.43/32 scram-sha-256
hostssl dps dps 10.42.0.0/16 scram-sha-256
hostssl dps dps 172.30.90.0/24 scram-sha-256
# BEGIN DPS PRS TLS DATABASES
# PRS uses the same non-superuser role and trusted client networks.
hostssl dps_prs_config,dps_prs_config_staged,dps_prs_controller dps 10.6.131.43/32 scram-sha-256
hostssl dps_prs_config,dps_prs_config_staged,dps_prs_controller dps 10.42.0.0/16 scram-sha-256
hostssl dps_prs_config,dps_prs_config_staged,dps_prs_controller dps 172.30.90.0/24 scram-sha-256
# END DPS PRS TLS DATABASES
host all all 0.0.0.0/0 reject
host all all ::/0 reject
