services:
  postgresql:
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: dps-postgresql
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "config_file=/etc/postgresql/config/postgresql.conf"]
    ports:
      - "10.6.131.43:15432:5432"
    volumes:
      - /raid/vince/deploy/dps-install/data/postgresql:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/config/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/config/pg_hba.conf:ro
      - ./tls:/etc/postgresql/tls:ro
      - ./secrets/admin-password:/run/secrets/admin-password:ro
      - ./secrets/dps-password:/run/secrets/dps-password:ro
      - ./10-init-dps.sql:/docker-entrypoint-initdb.d/10-init-dps.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - database
networks:
  database:
    name: dps-postgresql-net
    ipam:
      config:
        - subnet: 172.30.90.0/24
