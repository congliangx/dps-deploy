worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
  access_log /dev/stdout;
  upstream gb300_backend { server simulator:8443; keepalive 256; }
  ssl_certificate /etc/bmc-tls/tls.crt;
  ssl_certificate_key /etc/bmc-tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 18443 ssl;
    server_name gb300-r01-0001;
    location / {
      proxy_pass https://gb300_backend;
      proxy_set_header Host gb300-r01-0001;
      proxy_set_header X-Forwarded-Host gb300-r01-0001;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_buffering off;
      proxy_redirect off;
      proxy_read_timeout 60s;
    }
  }
